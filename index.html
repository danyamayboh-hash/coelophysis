<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COELOPHYSIS — Official Store</title>
  <style>
    :root {
      --bg: #050505;
      --text: #f3f4f6;
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-blur: blur(16px);
      --accent: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* HERO SECTION WITH VIDEO BACKGROUND */
    .dov-hero {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 40px;
      overflow: hidden;
    }

    .dov-bg-video {
      position: absolute;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      transform: translate(-50%, -50%);
      object-fit: cover;
      z-index: -1;
      filter: brightness(0.6) contrast(1.1);
    }

    /* HEADER & SPLIT LOGO */
    .dov-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .dov-logo {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 0.3em;
      color: #fff;
      text-transform: uppercase;
    }

    .dov-logo span {
      opacity: 0.4;
      font-weight: 300;
    }

    /* LIQUID GLASS NAV / RUNES */
    .dov-nav {
      display: flex;
      gap: 20px;
    }

    .rune-item {
      position: relative;
      cursor: pointer;
      font-size: 1.2rem;
      padding: 8px 12px;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    .rune-item:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }

    .rune-tooltip {
      position: absolute;
      bottom: -35px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      border: 1px solid var(--glass-border);
      color: #fff;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      padding: 4px 8px;
      border-radius: 4px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
    }

    .rune-item:hover .rune-tooltip {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* HERO CENTER TEXT */
    .dov-hero-content {
      z-index: 10;
      max-width: 600px;
    }

    .dov-hero-content h1 {
      font-size.clamp(2.5rem, 5vw, 4.5rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin-bottom: 16px;
      text-transform: uppercase;
    }

    .dov-hero-content p {
      font-size: 1rem;
      opacity: 0.7;
      letter-spacing: 0.05em;
      margin-bottom: 24px;
    }

    /* CATALOG SECTION */
    .dov-catalog {
      padding: 80px 40px;
      background: var(--bg);
    }

    .dov-catalog-title {
      font-size: 1.2rem;
      letter-spacing: 0.2em;
      margin-bottom: 40px;
      text-transform: uppercase;
      opacity: 0.5;
    }

    .dov-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 30px;
    }

    /* PRODUCT CARD */
    .dov-card {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 16px;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .dov-card:hover {
      transform: translateY(-5px);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .dov-slot {
      width: 100%;
      height: 360px;
      border-radius: 8px;
      overflow: hidden;
      background: #111;
      position: relative;
    }

    .dov-slot video, .dov-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .dov-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .dov-price {
      font-family: monospace;
      font-size: 0.95rem;
      margin-top: 6px;
      opacity: 0.8;
    }

    /* TELEGRAM ORDER BUTTON */
    .tg-order-btn {
      display: block;
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      background: #fff;
      color: #000;
      text-align: center;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      border-radius: 6px;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .tg-order-btn:hover {
      background: #e0e0e0;
    }

    .tg-order-btn:active {
      transform: scale(0.98);
    }

    /* FOOTER */
    footer {
      padding: 40px;
      text-align: center;
      font-size: 0.75rem;
      opacity: 0.4;
      letter-spacing: 0.1em;
      border-top: 1px solid var(--glass-border);
    }

    @media (max-width: 768px) {
      .dov-hero { padding: 20px; }
      .dov-catalog { padding: 40px 20px; }
    }
  </style>
</head>
<body>

  <!-- HERO SECTION -->
  <header class="dov-hero">
    <!-- Фоновое видео (убедись, что файл promo.mp4 лежит рядом с index.html) -->
    <video class="dov-bg-video" autoplay muted loop playsinline>

    <div class="dov-header">
      <div class="dov-logo">COELO<span>PHYSIS</span></div>
      <div class="dov-nav">
        <div class="rune-item">
          ᚛
          <div class="rune-tooltip">ORIGIN</div>
        </div>
        <div class="rune-item">

          <div class="rune-tooltip">ARCHIVE</div>

        <div class="rune-item">
          ᚼ

    <div class="dov-hero-content">
      <h1>Liquid Brutalism</h1>
      <p>Drop 01 / Engineered for the subterranean infrastructure.</p>
    </div>
  </header>

  <!-- CATALOG SECTION -->
  <section class="dov-catalog">

    <div class="dov-grid">
      
      <!-- ТОВАР 1 -->
      <div class="dov-card">
        <div class="dov-slot">
          <!-- Вместо item1.mp4 можно поставить картинку item1.jpg -->
          <video autoplay muted loop playsinline>
            <source src="item1.mp4" type="video/mp4">
          </video>
        </div>
        <div class="dov-meta">
          <span>COELO-TEE / 240G</span>
          <span style="color: #4ade80; font-size: 0.75rem;">IN STOCK</span>
        </div>
        <div class="dov-price">1 990 ₽</div>
        <a href="https://t.me/cphsshop?text=Привет!%20Хочу%20заказать%20COELO-TEE%20240G" target="_blank" rel="noopener" class="tg-order-btn">
          КУПИТЬ В TELEGRAM
        </a>
      </div>

      <!-- ТОВАР 2 -->
      <div class="dov-card">
        <div class="dov-slot">
          <!-- Вместо item2.mp4 можно поставить картинку item2.jpg -->
          <video autoplay muted loop playsinline>
            <source src="item2.mp4" type="video/mp4">
          </video>
        </div>
        <div class="dov-meta">
          <span>PHYSIS HOODIE / HEAVY</span>
          <span style="color: #4ade80; font-size: 0.75rem;">IN STOCK</span>
        </div>
        <div class="dov-price">4 900 ₽</div>
        <a href="https://t.me/cphsshop?text=Привет!%20Хочу%20заказать%20PHYSIS%20HOODIE%20Heavy" target="_blank" rel="noopener" class="tg-order-btn">
          КУПИТЬ В TELEGRAM
        </a>
      </div>

    </div>
  </section>

  <footer>
    COELOPHYSIS © 2026. ALL RIGHTS RESERVED.
  </footer>

</body>
</html>
