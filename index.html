<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COELOPHYSIS // DROP 01</title>
    <style>
        :root {
            --bg-color: #080808;
            --card-bg: #121212;
            --text-color: #ffffff;
            --text-muted: #888888;
            --border-color: #222222;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            letter-spacing: 0.06em;
            line-height: 1.6;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            border-bottom: 1px solid var(--border-color);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(8, 8, 8, 0.85);
            backdrop-filter: blur(12px);
            z-index: 100;
        }
        .logo {
            font-weight: 700;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            cursor: pointer;
        }
        .nav-right {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .cart-trigger {
            cursor: pointer;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            color: var(--text-color);
            text-transform: uppercase;
            font-size: 0.8rem;
            transition: 0.2s;
        }
        .cart-trigger:hover {
            border-color: #555;
        }
        main {
            padding-top: 120px;
            max-width: 1400px;
            margin: 0 auto;
            padding-left: 20px;
            padding-right: 20px;
            padding-bottom: 80px;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }
        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .product-card:hover {
            transform: translateY(-4px);
            border-color: #444;
        }
        .product-image {
            position: relative;
            width: 100%;
            height: 400px;
            overflow: hidden;
            background: #111;
        }
        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .product-card:hover .product-image img {
            transform: scale(1.03);
        }
        .product-image span {
            position: absolute;
            bottom: 15px;
            left: 15px;
            font-size: 0.75rem;
            color: var(--text-muted);
            background: rgba(0,0,0,0.6);
            padding: 4px 8px;
        }
        .product-info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .product-name {
            font-size: 0.95rem;
            font-weight: 500;
        }
        .product-price {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }
        @media(max-width: 768px) {
            .modal-content {
                grid-template-columns: 1fr;
            }
        }
        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 10;
            color: var(--text-muted);
        }
        .close-btn:hover { color: #fff; }
        .modal-gallery {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #0d0d0d;
        }
        #modalMainImg {
            width: 100%;
            height: 350px;
            object-fit: cover;
        }
        .modal-thumbs {
            display: flex;
            gap: 10px;
        }
        .modal-thumb {
            width: 60px;
            height: 60px;
            object-fit: cover;
            cursor: pointer;
            opacity: 0.6;
            border: 1px solid var(--border-color);
        }
        .modal-thumb.active { opacity: 1; border-color: #fff; }
        .modal-info {
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .modal-info h2 { font-size: 1.3rem; font-weight: 600; }
        .modal-info p { color: var(--text-muted); font-size: 1.1rem; }
        .size-selector {
            display: flex;
            gap: 10px;
        }
        .size-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 8px 16px;
            cursor: pointer;
            font-family: inherit;
        }
        .size-btn.active {
            border-color: #fff;
            background: #fff;
            color: #000;
        }
        .size-chart-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            margin-top: 10px;
        }
        .size-chart-table th, .size-chart-table td {
            border: 1px solid var(--border-color);
            padding: 8px;
            text-align: center;
        }
        .size-chart-table th { color: var(--text-muted); }
        .add-to-cart-btn {
            background: #fff;
            color: #000;
            border: none;
            padding: 14px;
            text-transform: uppercase;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.1em;
            margin-top: auto;
        }
        .add-to-cart-btn:hover { background: #e0e0e0; }

        /* Cart Drawer */
        .cart-drawer {
            position: fixed;
            top: 0; right: -400px;
            width: 400px;
            height: 100%;
            background: var(--card-bg);
            border-left: 1px solid var(--border-color);
            z-index: 1100;
            transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            padding: 30px;
        }
        .cart-drawer.active { right: 0; }
        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            font-size: 1.1rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .cart-footer {
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .cart-total {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            font-size: 1.1rem;
        }
        footer {
            text-align: center;
            padding: 40px;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        footer a { color: #fff; text-decoration: none; }
    </style>
</head>
<body>

    <header>
        <div class="logo">Coelophysis</div>
        <div class="nav-right">
            <div class="cart-trigger" onclick="toggleCartDrawer()">Корзина (<span id="cartCount">0</span>)</div>
        </div>
    </header>

    <main>
        <div class="products-grid">
            <!-- Товар: Hoodie CPHS-06 // Obsidian -->
            <div class="product-card" 
                 data-name="Hoodie CPHS-06 // Obsidian" 
                 data-price-num="9200" 
                 data-price="9,200 RUB" 
                 data-images="hoodie2_front.jpg,hoodie2_back.jpg" 
                 onclick="openProductFromCard(this)">
                <div class="product-image">
                    <img src="hoodie2_front.jpg" alt="Hoodie 06" onerror="this.style.display='none'">
                    <span>[ Hoodie 06 ]</span>
                </div>
                <div class="product-info">
                    <span class="product-name">Hoodie CPHS-06 // Obsidian</span>
                    <span class="product-price">9,200 RUB</span>
                </div>
            </div>

            <!-- Товар: T-Shirt CPHS-01 Vector -->
            <div class="product-card" 
                 data-name="T-Shirt CPHS-01 // Vector" 
                 data-price-num="2700" 
                 data-price="2,700 RUB" 
                 data-images="ts1_front_v3.jpg" 
                 onclick="openProductFromCard(this)">
                <div class="product-image">
                    <img src="ts1_front_v3.jpg" alt="T-Shirt 01" onerror="this.style.display='none'">
                    <span>[ T-Shirt 01 ]</span>
                </div>
                <div class="product-info">
                    <span class="product-name">T-Shirt CPHS-01 // Vector</span>
                    <span class="product-price">2,700 RUB</span>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2026 Coelophysis // Paleo-Brutalism. <a href="https://t.me/cphsshop" target="_blank">Telegram Channel</a></p>
    </footer>

    <!-- Модальное окно товара -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeProductModal()">&times;</span>
            <div class="modal-gallery">
                <img id="modalMainImg" src="" alt="Product">
                <div id="modalThumbs" class="modal-thumbs"></div>
            </div>
            <div class="modal-info">
                <h2 id="modalTitle"></h2>
                <p id="modalPrice"></p>
                <div class="size-selector">
                    <button class="size-btn" onclick="selectSize('S')">S</button>
                    <button class="size-btn" onclick="selectSize('M')">M</button>
                    <button class="size-btn" onclick="selectSize('L')">L</button>
                    <button class="size-btn" onclick="selectSize('XL')">XL</button>
                </div>
                <table class="size-chart-table">
                    <thead>
                        <tr>
                            <th>Size</th>
                            <th>Length</th>
                            <th>Width</th>
                            <th>Sleeve</th>
                        </tr>
                    </thead>
                    <tbody id="modalSizeChartBody"></tbody>
                </table>
                <button class="add-to-cart-btn" onclick="addToCartFromModal()">Добавить в корзину</button>
            </div>
        </div>
    </div>

    <!-- Выезжающая корзина -->
    <div id="cartDrawer" class="cart-drawer">
        <div class="cart-header">
            <span>Корзина</span>
            <span onclick="toggleCartDrawer()" style="cursor:pointer; font-size:1.4rem;">&times;</span>
        </div>
        <div class="cart-items" id="cartItems">
            <!-- Сюда падают товары -->
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Итого:</span>
                <span id="cartTotalPrice">0 RUB</span>
            </div>
            
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <input type="text" id="orderName" placeholder="Ваше имя" oninput="validateOrderForm()" style="background: #111; border: 1px solid #333; color: #fff; padding: 10px; font-family: inherit; outline: none;">
                <input type="text" id="orderContact" placeholder="Телефон или Telegram (@username)" oninput="validateOrderForm()" style="background: #111; border: 1px solid #333; color: #fff; padding: 10px; font-family: inherit; outline: none;">
            </div>

            <button id="checkoutBtn" style="padding: 14px; background: #fff; color: #000; border: none; text-transform: uppercase; font-weight: 600; cursor: not-allowed; opacity: 0.5; letter-spacing: 0.1em;" onclick="checkoutTelegram()" disabled>Оформить в Telegram</button>
        </div>
    </div>

    <script>
        let currentProduct = null;
        let selectedSize = 'M';
        let cart = [];

        function openProductFromCard(card) {
            const name = card.getAttribute('data-name');
            const priceNum = Number(card.getAttribute('data-price-num'));
            const price = card.getAttribute('data-price');
            const images = card.getAttribute('data-images').split(',');

            const measurements = {
                'S': { length: '68', width: '58', sleeve: '60' },
                'M': { length: '70', width: '60', sleeve: '61' },
                'L': { length: '72', width: '62', sleeve: '62' },
                'XL': { length: '74', width: '64', sleeve: '63' }
            };

            openProductModal({
                name: name,
                priceNum: priceNum,
                price: price,
                images: images,
                measurements: measurements
            });
        }

        function openProductModal(product) {
            currentProduct = product;
            document.getElementById('modalTitle').innerText = product.name;
            document.getElementById('modalPrice').innerText = product.price;
            
            const mainImg = document.getElementById('modalMainImg');
            const thumbsContainer = document.getElementById('modalThumbs');
            mainImg.src = product.images[0];
            thumbsContainer.innerHTML = '';
            
            product.images.forEach((imgSrc, index) => {
                const thumb = document.createElement('img');
                thumb.src = imgSrc;
                thumb.className = `modal-thumb ${index === 0 ? 'active' : ''}`;
                thumb.onclick = () => {
                    mainImg.src = imgSrc;
                    document.querySelectorAll('.modal-thumb').forEach(t => t.classList.remove('active'));
                    thumb.classList.add('active');
                };
                thumbsContainer.appendChild(thumb);
            });

            selectSize('M');
            document.getElementById('productModal').classList.add('active');
        }

        function closeProductModal() {
            document.getElementById('productModal').classList.remove('active');
        }

        function selectSize(size) {
            selectedSize = size;
            document.querySelectorAll('.size-btn').forEach(btn => {
                if (btn.innerText === size) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            if (currentProduct && currentProduct.measurements) {
                const m = currentProduct.measurements[size];
                const tbody = document.getElementById('modalSizeChartBody');
                tbody.innerHTML = `
                    <tr style="background: rgba(255,255,255,0.05);">
                        <td><strong>${size}</strong></td>
                        <td>${m.length}</td>
                        <td>${m.width}</td>
                        <td>${m.sleeve}</td>
                    </tr>
                `;
            }
        }

        function addToCartFromModal() {
            if (!currentProduct) return;
            cart.push({
                name: currentProduct.name,
                priceNum: currentProduct.priceNum,
                price: currentProduct.price,
                size: selectedSize
            });
            updateCartUI();
            closeProductModal();
            toggleCartDrawer();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function updateCartUI() {
            const cartItemsContainer = document.getElementById('cartItems');
            const cartCount = document.getElementById('cartCount');
            const cartTotalPrice = document.getElementById('cartTotalPrice');
            
            if (cartItemsContainer) {
                cartItemsContainer.innerHTML = '';
                let total = 0;
                cart.forEach((item, index) => {
                    total += item.priceNum;
                    cartItemsContainer.innerHTML += `
                        <div class="cart-item" style="display:flex; justify-content:space-between; align-items:center; background:#181818; padding:10px; border:1px solid #222; font-size:0.9rem;">
                            <span>${item.name} (${item.size}) - ${item.price}</span>
                            <span onclick="removeFromCart(${index})" style="color:#ff5555; cursor:pointer; font-weight:bold; padding:0 5px;">[×]</span>
                        </div>
                    `;
                });
                if (cartTotalPrice) cartTotalPrice.innerText = total.toLocaleString() + ' RUB';
            }
            if (cartCount) cartCount.innerText = cart.length;
        }

        function toggleCartDrawer() {
            const drawer = document.getElementById('cartDrawer');
            if (drawer) drawer.classList.toggle('active');
        }

        function validateOrderForm() {
            const name = document.getElementById('orderName').value.trim();
            const contact = document.getElementById('orderContact').value.trim();
            const btn = document.getElementById('checkoutBtn');

            if (!btn) return;
            if (name.length > 0 && contact.length > 0) {
                btn.removeAttribute('disabled');
                btn.style.opacity = '1';
                btn.style.cursor = 'pointer';
            } else {
                btn.setAttribute('disabled', 'true');
                btn.style.opacity = '0.5';
                btn.style.cursor = 'not-allowed';
            }
        }

        function checkoutTelegram() {
            if (cart.length === 0) {
                alert('Корзина пуста!');
                return;
            }

            const name = document.getElementById('orderName').value.trim();
            const contact = document.getElementById('orderContact').value.trim();

            if (!name || !contact) {
                alert('Пожалуйста, укажите ваше имя и контакт для связи!');
                return;
            }
            
            let text = '⚡ Новый заказ с сайта Coelophysis:\n\n';
            text += `👤 Имя: ${name}\n`;
            text += `📞 Связь: ${contact}\n\n`;
            text += '📦 Состав заказа:\n';

            cart.forEach(item => {
                text += `• ${item.name}\n  Размер: ${item.size} | ${item.price}\n\n`;
            });
            
            const totalText = document.getElementById('cartTotalPrice').innerText;
            text += `💰 Итого: ${totalText}`;

            const BOT_TOKEN = '8725885962:AAHtPAsEc4oNHE3wmBMRzGS9JVqeu02eUUM'; 
            const CHAT_ID = '-1004345884476';

            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: text
                })
            })
            .then(response => {
                if (response.ok) {
                    alert('Заказ успешно оформлен! Мы свяжемся с вами для подтверждения.');
                    cart = [];
                    updateCartUI();
                    toggleCartDrawer();
                    document.getElementById('orderName').value = '';
                    document.getElementById('orderContact').value = '';
                    validateOrderForm();
                } else {
                    alert('Ошибка отправки. Пожалуйста, напишите нам в Telegram напрямую.');
                }
            })
            .catch(error => {
                console.error('Ошибка:', error);
                alert('Ошибка соединения с сервером.');
            });
        }
    </script>
</body>
</html>
